<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220">
  <defs>
    <style>
      svg {
        --bg1: #0d1117; --bg2: #131a24; --dot: #21262d;
        --name1: #e6edf3; --name2: #22d3ee; --name3: #f778ba;
        --accent: #2f81f7; --accent-text: #79c0ff; --purple: #a371f7; --green: #3fb950;
        --muted: #7d8590; --meta: #6e7681; --label: #8b949e;
        --chip: #161b22; --chip-stroke: #30363d; --chip-text: #9da7b3;
        --edge: #232a33; --edge-lit: #30363d; --node: #161b22; --node-stroke: #3d444d;
        --pulse: #22d3ee; --particle: #8b949e; --sweep: #ffffff; --vig: 0.35;
        --glow-a: 0.22; --glow2-a: 0.12; --glow3-a: 0.08;
        --n1: #22d3ee; --n2: #a371f7; --n3: #f778ba;
      }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .name { font-size: 42px; font-weight: 700; fill: url(#nameGrad); letter-spacing: 0.4px; }
      .sub  { font-size: 14px; font-weight: 600; fill: var(--accent); letter-spacing: 3px; }
      .prompt { font-size: 13px; fill: var(--muted); }
      .caret { fill: var(--green); }
      .chip { fill: var(--chip); stroke: var(--chip-stroke); stroke-width: 1; }
      .chip-hi { fill: var(--chip); stroke: var(--accent); stroke-width: 1; }
      .chip-t { font-size: 12px; fill: var(--chip-text); text-anchor: middle; }
      .chip-t-hi { font-size: 12px; fill: var(--accent-text); text-anchor: middle; }
      .meta { font-size: 11px; fill: var(--meta); }
      .label { font-size: 11px; fill: var(--label); text-anchor: middle; }
      .edge { stroke: var(--edge); stroke-width: 1; fill: none; }
      .edge-lit { stroke: var(--edge-lit); stroke-width: 1; fill: none; }
      .node { fill: var(--node); stroke: var(--node-stroke); stroke-width: 1; }
      .ring { fill: none; stroke: var(--pulse); stroke-width: 1.5; opacity: 0; }
      .ring-p { fill: none; stroke: var(--purple); stroke-width: 1.5; opacity: 0; }
      .ring-g { fill: none; stroke: var(--green); stroke-width: 1.5; opacity: 0; }
      .pulse { fill: var(--pulse); }
      .particle { fill: var(--particle); }
      .dot { fill: var(--dot); }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: var(--bg1)"/>
      <stop offset="1" style="stop-color: var(--bg2)"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color: var(--name1)"/>
      <stop offset="0.6" style="stop-color: var(--name2)"/>
      <stop offset="1" style="stop-color: var(--name3)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color: var(--accent); stop-opacity: var(--glow-a)"/>
      <stop offset="1" style="stop-color: var(--accent); stop-opacity: 0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color: var(--purple); stop-opacity: var(--glow2-a)"/>
      <stop offset="1" style="stop-color: var(--purple); stop-opacity: 0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color: var(--green); stop-opacity: var(--glow3-a)"/>
      <stop offset="1" style="stop-color: var(--green); stop-opacity: 0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color: var(--sweep); stop-opacity: 0"/>
      <stop offset="0.5" style="stop-color: var(--sweep); stop-opacity: 0.045"/>
      <stop offset="1" style="stop-color: var(--sweep); stop-opacity: 0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" style="stop-color: #000000; stop-opacity: 0"/>
      <stop offset="1" style="stop-color: #000000; stop-opacity: var(--vig)"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" class="dot"/>
    </pattern>
    <filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <linearGradient id="neon" x1="0" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" style="stop-color: var(--n1)"/>
      <stop offset="0.33" style="stop-color: var(--n2)"/>
      <stop offset="0.66" style="stop-color: var(--n3)"/>
      <stop offset="1" style="stop-color: var(--n1)"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 440 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="neonRev" x1="0" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" style="stop-color: var(--n3)"/>
      <stop offset="0.33" style="stop-color: var(--n2)"/>
      <stop offset="0.66" style="stop-color: var(--n1)"/>
      <stop offset="1" style="stop-color: var(--n3)"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; -440 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nameGlow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComponentTransfer in="b" result="bf"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode in="bf"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="880" height="220" fill="url(#bg)"/>
  <rect width="880" height="220" fill="url(#dots)" opacity="0.6"/>

  <!-- drifting aurora blobs -->
  <ellipse cx="725" cy="110" rx="240" ry="120" fill="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -40 12; 20 -10; 0 0" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="140" cy="40" rx="220" ry="100" fill="url(#glow2)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 60 20; 20 40; 0 0" dur="18s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="420" cy="200" rx="260" ry="60" fill="url(#glow3)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 80 -10; -40 0; 0 0" dur="16s" repeatCount="indefinite"/>
  </ellipse>

  <!-- twinkling particles -->
  <g class="particle">
    <circle cx="470" cy="52" r="1.1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="170" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.1s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="565" cy="78" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.7s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="186" r="0.9"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.9s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="866" cy="50" r="1.1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="866" cy="180" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="140" r="0.9"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.9s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="44" r="1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.6s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- slow light sweep -->
  <rect x="-200" y="28" width="120" height="168" fill="url(#sweep)" transform="skewX(-20)">
    <animate attributeName="x" values="-200;1000" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- vignette -->
  <rect width="880" height="220" fill="url(#vignette)"/>

  <!-- neon edges -->
  <rect width="880" height="1.5" fill="url(#neonRev)" filter="url(#neonGlow)" opacity="0.9"/>

  <!-- window chrome -->
  <line x1="0" y1="28" x2="880" y2="28" class="edge"/>
  <line x1="590" y1="28" x2="590" y2="196" class="edge" opacity="0.5"/>
  <circle cx="20" cy="14" r="4" fill="#ff5f56" opacity="0.85"/>
  <circle cx="36" cy="14" r="4" fill="#ffbd2e" opacity="0.85"/>
  <circle cx="52" cy="14" r="4" fill="#27c93f" opacity="0.85"/>
  <text x="860" y="18" class="mono meta" text-anchor="end">github.com/developerkunal</text>
  <text x="16" y="212" class="mono meta">&#9666; main</text>
  <text x="860" y="212" class="mono meta" text-anchor="end">status: shipping</text>

  <!-- left content (always visible; no fade-in so static renders show it) -->
  <text x="40" y="68" class="mono prompt"><tspan class="caret">&#10095;</tspan> whoami</text>
  <rect x="102" y="57" width="7" height="13" class="pulse">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="40" y="112" class="sans name" filter="url(#nameGlow)">Kunal Dawar</text>
  <text x="41" y="138" class="sans sub">SDKs, AI TOOLING &amp; DEVELOPER EXPERIENCE</text>

  <!-- skill chips -->
  <rect x="40"  y="154" width="96"  height="24" rx="12" class="chip"/>
  <text x="88"  y="170" class="mono chip-t">TypeScript</text>
  <rect x="144" y="154" width="72"  height="24" rx="12" class="chip"/>
  <text x="180" y="170" class="mono chip-t">Node.js</text>
  <rect x="224" y="154" width="40"  height="24" rx="12" class="chip"/>
  <text x="244" y="170" class="mono chip-t">Go</text>
  <rect x="272" y="154" width="52"  height="24" rx="12" class="chip"/>
  <text x="298" y="170" class="mono chip-t">APIs</text>
  <rect x="332" y="154" width="102" height="24" rx="12" class="chip"/>
  <text x="383" y="170" class="mono chip-t">Open Source</text>
  <rect x="442" y="154" width="96"  height="24" rx="12" class="chip-hi"/>
  <text x="490" y="170" class="mono chip-t-hi">AI Tooling</text>

  <!-- right: dev -> SDK/API/CLI -> MCP/agent -> ship -->
  <!-- input to layer 2 -->
  <path class="edge-lit" d="M 625 112 L 695 68"/>
  <path class="edge-lit" d="M 625 112 L 695 112"/>
  <path class="edge-lit" d="M 625 112 L 695 156"/>
  <!-- layer 2 to layer 3 -->
  <path class="edge" d="M 695 68 L 765 88"/>
  <path class="edge" d="M 695 68 L 765 136"/>
  <path class="edge" d="M 695 112 L 765 88"/>
  <path class="edge" d="M 695 112 L 765 136"/>
  <path class="edge" d="M 695 156 L 765 88"/>
  <path class="edge" d="M 695 156 L 765 136"/>
  <!-- layer 3 to output -->
  <path class="edge-lit" d="M 765 88 L 835 112"/>
  <path class="edge-lit" d="M 765 136 L 835 112"/>

  <!-- nodes with glow rings -->
  <circle cx="625" cy="112" r="6.5" class="node"/>
  <circle cx="625" cy="112" r="6.5" class="ring"><animate attributeName="opacity" values="0;1;0" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="695" cy="68" r="5" class="node"/>
  <circle cx="695" cy="68" r="5" class="ring"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="695" cy="112" r="5" class="node"/>
  <circle cx="695" cy="112" r="5" class="ring"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="695" cy="156" r="5" class="node"/>
  <circle cx="695" cy="156" r="5" class="ring"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="765" cy="88" r="5.5" class="node"/>
  <circle cx="765" cy="88" r="5.5" class="ring-p"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="0.9s" repeatCount="indefinite"/></circle>
  <circle cx="765" cy="136" r="5.5" class="node"/>
  <circle cx="765" cy="136" r="5.5" class="ring-p"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="835" cy="112" r="7" class="node"/>
  <circle cx="835" cy="112" r="7" class="ring-g"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="1.4s" repeatCount="indefinite"/></circle>

  <!-- node labels -->
  <text x="625" y="138" class="mono label">dev</text>
  <text x="695" y="54"  class="mono label">SDK</text>
  <text x="695" y="100" class="mono label">API</text>
  <text x="695" y="177" class="mono label">CLI</text>
  <text x="765" y="74"  class="mono label">MCP</text>
  <text x="765" y="159" class="mono label">agent</text>
  <text x="835" y="138" class="mono label">ship</text>

  <!-- travelling pulses (with soft glow underlay) -->
  <g>
    <circle r="5" class="pulse" opacity="0.5" filter="url(#soft)">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M 625 112 L 695 68 L 765 88 L 835 112"/>
    </circle>
    <circle r="2.5" class="pulse">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M 625 112 L 695 68 L 765 88 L 835 112"/>
    </circle>
  </g>
  <g>
    <circle r="5" class="pulse" opacity="0.5" filter="url(#soft)">
      <animateMotion dur="3.6s" begin="-2.4s" repeatCount="indefinite" path="M 625 112 L 695 112 L 765 136 L 835 112"/>
    </circle>
    <circle r="2.5" class="pulse">
      <animateMotion dur="3.6s" begin="-2.4s" repeatCount="indefinite" path="M 625 112 L 695 112 L 765 136 L 835 112"/>
    </circle>
  </g>
  <g>
    <circle r="5" class="pulse" opacity="0.5" filter="url(#soft)">
      <animateMotion dur="3.6s" begin="-1.2s" repeatCount="indefinite" path="M 625 112 L 695 156 L 765 88 L 835 112"/>
    </circle>
    <circle r="2.5" class="pulse">
      <animateMotion dur="3.6s" begin="-1.2s" repeatCount="indefinite" path="M 625 112 L 695 156 L 765 88 L 835 112"/>
    </circle>
  </g>
</svg>
